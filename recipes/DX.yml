---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: wafflosagus-bluefin-dx
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-dx-gnome
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  #  - type: akmods
  #    base: asus # if not specified, classic "main" base is used by default
  #    install:
  #      - framework-laptop
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      copr:
        - atim/starship
        #- ryanabx/cosmic-epoch
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
        #- https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        #- https://raw.githubusercontent.com/Waffleophagus/wafflOSagus/refs/heads/main/repo-files/vscodium.repo
        - https://yum.tableplus.com/rpm/x86_64/tableplus.repo
    install:
      packages:
        - micro
        #- codium
        - starship
        - tableplus
        - tldr
        - xclip
        #- cosmic-desktop
        #- docker-ce
        #- docker-ce-cli
        #- containerd.io
        #- docker-buildx-plugin
        #- docker-compose-plugin
        #- tailscale
    #remove:
    #  packages:
    #    # example: removing firefox (in favor of the flatpak)
    #    - firefox
    #    - firefox-langpacks
    #    - waydroid
    #    - waydroid-selinux
  - type: script
    scripts:
      # Custom changes for deckstation
      - install-cosmic.sh

  - type: justfiles
    #    validate: true
    include:
      - my-just.just

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
        remove:
          - org.gnome.eog
      - notify: true
        scope: user
        install: []

  - type: signing # this sets up the proper policy & signing files for signed images to work fully

