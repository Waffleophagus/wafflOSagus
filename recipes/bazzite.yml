---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: wafflosagus-bazzite
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite-gnome
image-version: stable # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      cleanup: true
      copr:
        - ryanabx/cosmic-epoch
        - imput/helium # Helium browser (https://helium.computer)
    install:
      packages:
        - cosmic-desktop
        - https://bitwarden.com/download/?app=desktop&platform=linux&variant=rpm
        - helium-bin # installs to /opt/helium; BlueBuild relocates /opt automatically

  # Use dnf, not the rpm-ostree module: rpm-ostree can't detect container builds
  # on chunkah-built F45 bases and fails with "This system was not booted via
  # libostree" (coreos/rpm-ostree#5634).
  - type: dnf
    repos:
      copr:
        - atim/starship
        - lihaohong/forgejo-cli
      files:
        - https://download.docker.com/linux/fedora/docker-ce.repo
        - https://repository.mullvad.net/rpm/stable/mullvad.repo
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
        - https://raw.githubusercontent.com/Waffleophagus/wafflOSagus/refs/heads/main/repo-files/vscodium.repo
        - https://yum.tableplus.com/rpm/x86_64/tableplus.repo
    install:
      packages:
        - micro
        - codium
        - starship
        - tableplus
        - tldr
        - xclip
        - forgejo-cli
        #- https://github.com/peteonrails/voxtype/releases/download/v0.6.5/voxtype-0.6.5-1.x86_64.rpm
        #- https://github.com/OpenWhispr/openwhispr/releases/latest/download/OpenWhispr-1.7.0-linux-x86_64.rpm
        - docker-ce
        - docker-ce-cli
        - https://github.com/anomalyco/opencode/releases/latest/download/opencode-desktop-linux-x86_64.rpm
        - containerd.io
        - mullvad-browser
        - docker-buildx-plugin
        - docker-compose-plugin
        - tailscale
        - wtype
        - wl-clipboard
        # Official Hex stable RPM (https://github.com/anomalyco/hex#downloads).
        - https://anoma.ly/hex/download/linux-x64-rpm
    #remove:
    #  packages:
    #    # example: removing firefox (in favor of the flatpak)
    #    - firefox
    #    - firefox-langpacks
    #    - waydroid
    #    - waydroid-selinux
  - type: systemd
    system:
      enabled:
        - docker.service

  - type: gnome-extensions
    install:
      # - AppIndicator and KStatusNotifierItem Support
      - Auto Power Profile
      #- Battery Usage Wattmeter
      - Blur my Shell
      - Dash to Dock
      #- Forge
      #- GSConnect
      #- OpenWeather Refined
      #- Tailscale QS
  - type: justfiles
    #    validate: true
    include:
      - my-just.just

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.gnome.Loupe
        remove:
          - org.gnome.eog
      - notify: true
        scope: user
        install: []

  - type: script
    scripts:
      - bake-input-group.sh

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
